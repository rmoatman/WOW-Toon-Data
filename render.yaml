# Render Blueprint for WOW-Toon-Data
# Single Web Service: the Express API also serves the built React SPA from the
# same origin, so the auth cookie is first-party and works in every browser
# (including Safari/iOS, which block third-party cookies). MongoDB is hosted
# separately on MongoDB Atlas (set MONGO_URI).
services:
  - type: web
    name: wow-toon-data-api
    runtime: node
    plan: free
    # Build the client bundle (served by the server). --include=dev is required
    # because NODE_ENV=production otherwise skips Vite (a devDependency).
    buildCommand: npm install --include=dev && npm run build --workspace client
    startCommand: npm start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # The app's own URL (this service). Used for CORS + the OAuth redirect back.
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: BLIZZARD_CLIENT_ID
        sync: false
      - key: BLIZZARD_CLIENT_SECRET
        sync: false
      - key: BLIZZARD_REDIRECT_URI
        sync: false
      - key: BLIZZARD_REGION
        value: us
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
